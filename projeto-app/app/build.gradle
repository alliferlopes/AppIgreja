}

android {
    namespace 'br.com.luzespe.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.luzespe.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}
